<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 240 240">
  <!-- Step Pet app icon: the step capsule on its rail, with a sprout. Full-bleed square; the OS rounds it. -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#3A3530"/>
      <stop offset="1" stop-color="#1C1A17"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#77716A"/>
      <stop offset="0.6" stop-color="#2A2724"/>
      <stop offset="1" stop-color="#4A4540"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFAF3"/>
      <stop offset="1" stop-color="#E0D7C6"/>
    </linearGradient>
    <filter id="capShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="railShadow" x="-10%" y="-50%" width="120%" height="250%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="240" height="240" fill="url(#bg)"/>
  <g id="mark">
    <rect x="-4" y="138" width="248" height="16" rx="8" fill="url(#rail)" filter="url(#railShadow)"/>
    <g transform="translate(90 58)">
      <path d="M30 48 C30 34 30 26 28 18" fill="none" stroke="#9CCB7E" stroke-width="5" stroke-linecap="round"/>
      <path d="M28 22 C14 10 4 16 8 26 C18 28 24 26 28 22 Z" fill="#9CCB7E" stroke="#1C1A17" stroke-width="2"/>
      <path d="M29 20 C40 4 56 8 50 22 C42 26 34 24 29 20 Z" fill="#B7DB98" stroke="#1C1A17" stroke-width="2"/>
    </g>
    <rect x="40" y="104" width="160" height="84" rx="42" fill="url(#cap)" filter="url(#capShadow)"/>
    <path d="M84 107.5 H156" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <circle cx="94" cy="146" r="7" fill="#6F7D5C"/>
    <circle cx="120" cy="146" r="7" fill="#2A2622"/>
    <circle cx="146" cy="146" r="7" fill="#2A2622"/>
    <rect x="82" y="168" width="76" height="5" rx="2.5" fill="#C2553A"/>
  </g>
</svg>
